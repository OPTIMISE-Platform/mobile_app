org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 opt-outs. Several plugins (device_info_plus, flutter_timezone,
# fluttertoast, nsd_android, package_info_plus, share_plus) apply kotlin-android
# at the locked versions, which fails under built-in Kotlin and the new DSL.
# Newer releases of device_info_plus, fluttertoast, package_info_plus and
# share_plus no longer do; the latest flutter_timezone and nsd_android still do.
android.builtInKotlin=false
android.newDsl=false
