org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 opt-outs. Several plugins (device_info_plus, flutter_timezone,
# nsd_android, package_info_plus, share_plus) still apply kotlin-android even in
# their latest releases, which fails under built-in Kotlin and the new DSL.
android.builtInKotlin=false
android.newDsl=false
