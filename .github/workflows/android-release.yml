name: 'Android Release'

# dev publishes prereleases, master stable releases. The version comes from the
# tags and the commits, see docs/releases-and-versioning.md.
on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  # Devices built before the prerelease topic existed only listen on
  # "android". Switch this to "android-prerelease" once those have updated.
  PRERELEASE_TOPIC: android

jobs:
  version:
    if: github.ref_name == 'dev' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    # The build number is the highest tag plus one, so versions are handed out
    # one at a time and reserved by pushing the tag right away. Only this short
    # job is serialized: GitHub keeps one pending run per group and cancels an
    # older one, which for a whole ten-minute release could drop a master run.
    concurrency:
      group: android-release-version
      cancel-in-progress: false
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          channel=${{ github.ref_name == 'master' && 'stable' || 'prerelease' }}
          .github/scripts/release-version.sh "$channel" | tee -a "$GITHUB_OUTPUT"
      - name: "Reserve the tag"
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      NAME: ${{ needs.version.outputs.name }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc: a version older than the pubspec asks for
          # fails the release build in `pub get`, which has happened before.
          flutter-version: '3.47.5'
      - run: git config --global url."https://".insteadOf git:// # allows dependency downloads without gpg
      - run: flutter pub get
      - name: "Prepare environment"
        run: |
          echo '${{ secrets.SEPL_KEYSTORE }}' | base64 -d > android/sepl.keystore
          echo '${{ secrets.KEY_PROPERTIES }}' | base64 -d > android/key.properties
          echo '${{ secrets.DOT_ENV }}' > .env
          echo "DISTRIBUTOR=github" >> .env
      - name: "Build app"
        run: flutter build apk --no-tree-shake-icons --build-name "$NAME" --build-number "$BUILD"
      - name: "Create release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # A re-run of this job finds the release from the first attempt.
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          flags=(--prerelease)
          if [[ $PRERELEASE != true ]]; then
            # Notes from the last stable release, not from the last prerelease.
            flags=(--latest)
            previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            [[ -n $previous ]] && flags+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" \
            build/app/outputs/flutter-apk/app-release.apk LICENSE
      - name: "Notify devices"
        # Pinned to a commit: the action only publishes a moving "latest" tag.
        uses: senergy-platform/firebase-cloud-messaging-action@de210700a2573098a52c3d0fdac4410a5ea1671b
        with:
          CREDENTIALS: ${{ secrets.FCM_CREDENTIALS }}
          MESSAGE: '{"topic": "${{ needs.version.outputs.prerelease == ''true'' && env.PRERELEASE_TOPIC || ''android'' }}", "data": {"type": "release_info"}}'

  ios:
    # Runs after a failed release job as well: a failing device notification
    # leaves a complete release behind, and without a release the upload fails
    # visibly.
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.outputs.skip != 'true' }}
    runs-on: macos-15
    env:
      NAME: ${{ needs.version.outputs.name }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: "Select Xcode"
        # Keep in step with the Xcode used for local ad hoc builds.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the release job above and with .fvmrc.
          flutter-version: '3.47.5'
      - run: git config --global url."https://".insteadOf git:// # allows dependency downloads without gpg
      - run: flutter pub get
      - name: "Prepare environment"
        run: |
          echo '${{ secrets.DOT_ENV }}' > .env
          echo "DISTRIBUTOR=github" >> .env
      - name: "Install signing material"
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          for s in IOS_P12 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE; do
            [[ -n ${!s} ]] || { echo "::error::Secret $s is not set"; exit 1; }
          done
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 24)
          echo "$IOS_P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/distribution.p12"
          # Xcode 16 and later read the second directory, older tools the first.
          for d in ~/Library/MobileDevice/"Provisioning Profiles" ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$d/adhoc.mobileprovision"
          done
      - name: "Build IPA"
        shell: bash
        # CFBundleShortVersionString only takes numbers, so the -dev.N suffix goes.
        run: >
          flutter build ipa --release --no-tree-shake-icons
          --build-name "${NAME%%-*}" --build-number "$BUILD"
          --export-options-plist ios/ExportOptions-adhoc.plist
      - name: "Attach to release"
        shell: bash
        # The app offers an iOS update once the manifest exists, so it goes up
        # after the IPA it points at.
        run: |
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          info() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          # Read before the heredoc: a failure inside it would not stop the step.
          bundle_id=$(info CFBundleIdentifier)
          version=$(info CFBundleShortVersionString)
          title=$(info CFBundleDisplayName)
          cat > "$RUNNER_TEMP/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://github.com/$GITHUB_REPOSITORY/releases/download/${TAG//+/%2B}/mobile_app.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>$bundle_id</string>
                  <key>bundle-version</key>
                  <string>$version</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>$title</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/manifest.plist"
          gh release upload "$TAG" build/ios/ipa/mobile_app.ipa --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/manifest.plist" --clobber
      - name: "Remove signing material"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/"Provisioning Profiles"/adhoc.mobileprovision \
            ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/adhoc.mobileprovision
