name: 'Checks'

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc, which is what developers run locally.
          # Older versions ship a Dart below the pubspec's sdk constraint and
          # fail in `pub get` before any check runs.
          flutter-version: '3.47.5'
      - run: git config --global url."https://".insteadOf git:// # allows dependency downloads without gpg
      - run: flutter pub get
      - name: "Prepare environment"
        # The analyzer and the tests do not talk to the backend, but the app
        # reads .env at startup, so the keys have to exist.
        run: cp .env.example .env
      - name: "Analyze"
        # Errors and warnings gate; the remaining style infos are a separate
        # backlog and would keep this red without saying anything new.
        run: flutter analyze --no-fatal-infos
      - name: "Cache Isar core binary"
        # The isar-tagged tests download it otherwise on every run, which makes
        # the test step depend on binaries.isar-community.dev being up. The file
        # name carries the Isar version, so a restored older one is not used.
        uses: actions/cache@v4
        with:
          path: .dart_tool/isar
          key: isar-core-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: isar-core-${{ runner.os }}-
      - name: "Test"
        # --run-skipped includes the `isar` tag, which dart_test.yaml skips on
        # hosts whose glibc is too old for the Isar core binary.
        run: flutter test --run-skipped
      - name: "Test release versioning"
        run: .github/scripts/release-version.test.sh
