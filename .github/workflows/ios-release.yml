name: 'iOS Release'

# Attaches an ad hoc IPA to the release the Android workflow has just tagged,
# so both platforms share one version. Ad hoc builds only install on the
# devices listed in the provisioning profile.
on:
  workflow_run:
    workflows: ['Android Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. 0.2.0+422'
        required: true

permissions:
  contents: write

jobs:
  ipa:
    # Also after a failed run: the release exists once its release step is
    # done, even if the device notification after it fails.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag=$INPUT_TAG
          if [[ -z $tag ]]; then
            # The commit carries the tag of its channel; master and dev commits
            # can both be tagged after a merge, so pick by branch.
            if [[ $BRANCH == master ]]; then
              tag=$(git tag --points-at HEAD -l '*+*' | grep -v -- '-dev\.' | tail -1 || true)
            else
              tag=$(git tag --points-at HEAD -l '*-dev.*+*' | tail -1 || true)
            fi
          fi
          if [[ ! $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?\+[0-9]+$ ]]; then
            echo "No release tag on this commit, nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! assets=$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null); then
            echo "No release for $tag, the Android workflow failed before creating it."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A run for a commit that was skipped by the Android workflow finds
          # the release from its first run, which already has the IPA.
          if grep -qx mobile_app.ipa <<<"$assets"; then
            echo "Release $tag already has an IPA."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          name=${tag%%+*}
          {
            echo "tag=$tag"
            # CFBundleShortVersionString only takes numbers, so the -dev.N suffix goes.
            echo "name=${name%%-*}"
            echo "build=${tag##*+}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
      - name: "Select Xcode"
        if: steps.version.outputs.skip != 'true'
        # Keep in step with the Xcode used for local ad hoc builds.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.skip != 'true'
        with:
          # Keep in sync with .fvmrc.
          flutter-version: '3.47.5'
      - if: steps.version.outputs.skip != 'true'
        run: git config --global url."https://".insteadOf git:// # allows dependency downloads without gpg
      - if: steps.version.outputs.skip != 'true'
        run: flutter pub get
      - name: "Prepare environment"
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo '${{ secrets.DOT_ENV }}' > .env
          echo "VERSION=$TAG" >> .env
      - name: "Install signing material"
        if: steps.version.outputs.skip != 'true'
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          for s in IOS_P12 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE; do
            [[ -n ${!s} ]] || { echo "::error::Secret $s is not set"; exit 1; }
          done
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 24)
          echo "$IOS_P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/distribution.p12"
          # Xcode 16 and later read the second directory, older tools the first.
          for d in ~/Library/MobileDevice/"Provisioning Profiles" ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$d/adhoc.mobileprovision"
          done
      - name: "Build IPA"
        if: steps.version.outputs.skip != 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
        run: >
          flutter build ipa --release --no-tree-shake-icons
          --build-name "$NAME" --build-number "$BUILD"
          --export-options-plist ios/ExportOptions-adhoc.plist
      - name: "Attach to release"
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" build/ios/ipa/mobile_app.ipa --clobber
      - name: "Remove signing material"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/"Provisioning Profiles"/adhoc.mobileprovision \
            ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/adhoc.mobileprovision
